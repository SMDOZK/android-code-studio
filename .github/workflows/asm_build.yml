name: Build Android Code Studio

on:
  push:
    branches: 
      - "dev"
      - "main" 
      - "indexing"
      - "release/**"
    paths-ignore:
      - '**.md'
      - '**.json'
      - 'fastlane/**'
      - '.github/workflows/crowdin_contributors.yml'
  pull_request:
    branches: [ "dev" ]
    paths-ignore:
      - '**.md'
      - '**.json'
      - 'fastlane/**'
      - '.github/workflows/crowdin_contributors.yml'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Select Build Type'
        required: true
        default: 'Release'
        type: choice
        options:
          - Debug
          - Release

jobs:
  build_release_apk:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Cancel previous runs
        uses: styfle/cancel-workflow-action@0.12.1
        with:
          access_token: ${{ github.token }}
          
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: Determine Build Type Configuration
        run: |
          SELECTED_TYPE="${{ github.event.inputs.build_type }}"
          BUILD_TYPE="${SELECTED_TYPE:-Release}"
          echo "BUILD_TYPE=$BUILD_TYPE" >> $GITHUB_ENV
          echo "BUILD_TYPE_LOWER=$(echo "$BUILD_TYPE" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'adopt'

      - name: Generating missing dirs
        run: mkdir -p /home/runner/work/android-code-studio/android-code-studio/core/app/build/intermediates/external_file_lib_dex_archives/debug/desugarDebugFileDependencies && mkdir -p /home/runner/work/android-code-studio/android-code-studio/core/app/build/intermediates/l8_art_profile/release/l8DexDesugarLibRelease

      - name: Change Gradle wrapper permissions
        run: chmod +x ./gradlew

      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-v2-${{ hashFiles('**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Create local.properties
        run: |
          echo "signing.storeFile=signing/signing-key.jks" >> local.properties
          echo "signing.storePassword=${{ secrets.SIGNING_SK_PASSWORD }}" >> local.properties
          echo "signing.keyAlias=androidcs" >> local.properties
          echo "signing.keyPassword=${{ secrets.SIGNING_SK_PASSWORD }}" >> local.properties

      - name: Assemble APK
        shell: bash
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -o pipefail
          ./gradlew assemble${{ env.BUILD_TYPE }} --console=plain 2>&1 | tee build.log

      # Derleme başarısız olursa hata satırlarını "annotation" olarak yaz (API'den okunabilsin)
      - name: Report build errors
        if: failure()
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          try:
              lines = open("build.log", encoding="utf-8", errors="replace").read().splitlines()
          except FileNotFoundError:
              lines = ["build.log yok"]
          pat = re.compile(r"^(e: |.*error:|FAILURE:|> Task .* FAILED|Execution failed|.*Unresolved reference|.*Could not (resolve|find|determine|get)|Caused by:|.*Exception:)")
          picked = []
          for i, l in enumerate(lines):
              if l.startswith("* What went wrong"):
                  picked.extend(lines[i:i + 15])
              elif pat.search(l):
                  picked.append(l)
          if not picked:
              picked = lines[-150:]
          seen, out = set(), []
          for l in picked:
              l = l[:400]
              if l not in seen:
                  seen.add(l)
                  out.append(l)
          out = out[:200]
          esc = lambda s: s.replace("%", "%25").replace("\r", "").replace("\n", "%0A")
          for n in range(0, len(out), 20):
              print("::error title=Derleme hatasi " + str(n // 20 + 1) + "::" + esc("\n".join(out[n:n + 20])))
          PY

      - name: List APK files
        run: ls -la core/app/build/outputs/apk/${{ env.BUILD_TYPE_LOWER }}/ || echo "Directory not found"

      - name: Upload arm64-v8a APK
        uses: actions/upload-artifact@v4
        with:
          name: ACS-arm64-v8a-${{ env.BUILD_TYPE_LOWER }}
          path: core/app/build/outputs/apk/${{ env.BUILD_TYPE_LOWER }}/*arm64-v8a*.apk
          if-no-files-found: error
